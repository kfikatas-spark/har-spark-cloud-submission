# Baseline local experiment: phone accelerometer only, five-second windows.
# `har-spark` loads this file by default through `config.load_config`; the
# resulting AppConfig controls Spark creation, preprocessing, splitting, both
# MLlib models, and the timestamped result directory.  Use this small baseline
# to compare one-sensor features with the fused configurations below.

# Reproducibility identity shared by subject splitting and Random Forest.
project:
  name: har-spark-cloud
  seed: 42

# Local Spark resources. Cluster launchers may omit `master`.
spark:
  app_name: WISDM-HAR
  master: "local[6]"
  shuffle_partitions: 8
  driver_memory: "4g"

# Raw WISDM selection and the Parquet path used by prepare/train workflows.
data:
  raw_glob: "data/raw/wisdm-dataset/raw/phone/accel/*.txt"
  device: phone
  sensor: accel
  window_seconds: 5
  minimum_samples_per_window: 70
  expected_sampling_hz: 20
  processed_path: "data/processed/phone_accel_5s_balanced.parquet"

# Fractions apply to whole participants, never randomly selected windows.
split:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

# Hyperparameters consumed by `model._pipeline` for the two-model comparison.
models:
  logistic_regression:
    max_iter: 80
    reg_param: 0.05
    elastic_net_param: 0.0
  random_forest:
    num_trees: 80
    max_depth: 12
    feature_subset_strategy: sqrt

# Every full run creates a new UTC-timestamped child under this directory.
output:
  results_root: results
