const DETAILS = {source: {"e_main":{"kind":"node","title":"main()","subtitle":"src/har_spark/cli.py:34","long_text":"<p>Η <code>main()</code> είναι το σημείο εισόδου της τοπικής εφαρμογής. Ανάλογα με την εντολή του χρήστη, ξεκινά ολόκληρο το πείραμα από τις αρχικές μετρήσεις, μόνο την προεπεξεργασία ή την εκπαίδευση από έτοιμα αρχεία χαρακτηριστικών Parquet. Η ίδια συντονίζει τις κλήσεις, χωρίς να υπολογίζει χαρακτηριστικά ή να εκπαιδεύει μοντέλα.</p>"},"e_parser":{"kind":"node","title":"build_parser()","subtitle":"src/har_spark/cli.py:19","long_text":"<p>Η <code>build_parser()</code> ορίζει τις εντολές της εφαρμογής και τις παραμέτρους τους. Αναλύει την εντολή που πληκτρολόγησε ο χρήστης, ώστε η εφαρμογή να επιλέξει τη ζητούμενη λειτουργία.</p>"},"e_config":{"kind":"node","title":"load_config()","subtitle":"src/har_spark/config.py:56","long_text":"<p>Η <code>load_config()</code> διαβάζει το αρχείο YAML και ελέγχει τη δομή του. Οι ρυθμίσεις περιλαμβάνουν τη συσκευή, τους αισθητήρες, τη διάρκεια παραθύρου, τις αναλογίες διαχωρισμού δεδομένων, τις επιλογές του Spark και τις υπερπαραμέτρους των μοντέλων.</p>"},"e_all":{"kind":"node","title":"run_all()","subtitle":"src/har_spark/pipeline.py:113","long_text":"<p>Η <code>run_all()</code> εκτελεί ολόκληρο το τοπικό πείραμα. Υπολογίζει πρώτα τα χαρακτηριστικά από τις αρχικές μετρήσεις και στη συνέχεια καλεί την εκπαίδευση και την αξιολόγηση των δύο μοντέλων.</p>"},"e_prepare":{"kind":"node","title":"prepare_features()","subtitle":"src/har_spark/pipeline.py:26","long_text":"<p>Η <code>prepare_features()</code> συντονίζει την προεπεξεργασία: δημιουργεί SparkSession, διαβάζει και ελέγχει τις μετρήσεις, υπολογίζει χαρακτηριστικά ανά παράθυρο, συνδυάζει τα δεδομένα των αισθητήρων και τα χωρίζει ανά άτομο. Επιστρέφει το DataFrame που θα χρησιμοποιηθεί στην εκπαίδευση και την αξιολόγηση.</p>"},"e_from":{"kind":"node","title":"run_from_processed()","subtitle":"src/har_spark/pipeline.py:122","long_text":"<p>Η <code>run_from_processed()</code> διαβάζει χαρακτηριστικά που έχουν ήδη αποθηκευτεί σε Parquet. Έτσι επαναλαμβάνονται μόνο η εκπαίδευση και η αξιολόγηση, χωρίς νέα ανάγνωση των αρχικών μετρήσεων ή επανυπολογισμό χαρακτηριστικών.</p>"},"e_write":{"kind":"node","title":"write_features()","subtitle":"src/har_spark/pipeline.py:77","long_text":"<p>Η <code>write_features()</code> αποθηκεύει το DataFrame χαρακτηριστικών σε Parquet. Αποθηκεύει δεδομένα, όχι εκπαιδευμένο μοντέλο. Τα αρχεία μπορούν να χρησιμοποιηθούν σε επόμενες εκτελέσεις, χωρίς να επαναληφθεί η προεπεξεργασία.</p>"},"e_models":{"kind":"node","title":"_run_models()","subtitle":"src/har_spark/pipeline.py:83","long_text":"<p>Η <code>_run_models()</code> καλεί διαδοχικά τη <code>train_and_evaluate()</code> για τη Λογιστική Παλινδρόμηση και το Random Forest, με τα ίδια δεδομένα. Στο τέλος αποθηκεύει τη σύγκριση των αποτελεσμάτων.</p>"},"e_0_e_main_e_parser":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → build_parser()","long_text":"Αναλύει την εντολή του χρήστη και τις παραμέτρους της.","source":"main()","target":"build_parser()"},"e_1_e_main_e_config":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → load_config()","long_text":"Φορτώνει από το YAML τις ρυθμίσεις που χρειάζεται η επιλεγμένη εντολή.","source":"main()","target":"load_config()"},"e_2_e_main_e_all":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → run_all()","long_text":"Ξεκινά ολόκληρο το πείραμα από τις αρχικές μετρήσεις.","source":"main()","target":"run_all()"},"e_3_e_main_e_prepare":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → prepare_features()","long_text":"Εκτελεί μόνο την προεπεξεργασία, με δυνατότητα αποθήκευσης των χαρακτηριστικών.","source":"main()","target":"prepare_features()"},"e_4_e_main_e_from":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → run_from_processed()","long_text":"Ξεκινά την εκπαίδευση από ήδη επεξεργασμένα δεδομένα.","source":"main()","target":"run_from_processed()"},"e_5_e_main_e_write":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → write_features()","long_text":"Αποθηκεύει το DataFrame χαρακτηριστικών σε Parquet, εφόσον ζητηθεί.","source":"main()","target":"write_features()"},"e_6_e_from_e_models":{"kind":"edge","title":"Άμεση κλήση","subtitle":"run_from_processed() → _run_models()","long_text":"Δίνει τα χαρακτηριστικά που διαβάστηκαν από το Parquet στην εκπαίδευση των δύο μοντέλων.","source":"run_from_processed()","target":"_run_models()"},"e_7_e_all_e_models":{"kind":"edge","title":"Άμεση κλήση","subtitle":"run_all() → _run_models()","long_text":"Μετά την προεπεξεργασία, δίνει τα χαρακτηριστικά στην εκπαίδευση των δύο μοντέλων.","source":"run_all()","target":"_run_models()"},"p_root":{"kind":"node","title":"prepare_features()","subtitle":"src/har_spark/pipeline.py:26","long_text":"<p>Η <code>prepare_features()</code> παρουσιάζεται εδώ αναλυτικά, ως αρχή της προεπεξεργασίας. Δέχεται τις αρχικές μετρήσεις και τις ρυθμίσεις του πειράματος και επιστρέφει το DataFrame χαρακτηριστικών.</p>"},"p_spark":{"kind":"node","title":"build_spark()","subtitle":"src/har_spark/spark.py:16","long_text":"<p>Η <code>build_spark()</code> δημιουργεί ή ανακτά το SparkSession με τις τοπικές ρυθμίσεις. Μέσω αυτού διαβάζονται και μετασχηματίζονται τα DataFrames. Η δημιουργία του SparkSession δεν συνεπάγεται ότι έχουν ήδη εκτελεστεί οι υπολογισμοί.</p>"},"p_parse":{"kind":"node","title":"parse_wisdm_raw()","subtitle":"src/har_spark/ingest.py:16","long_text":"<p>Η <code>parse_wisdm_raw()</code> αναλύει τις γραμμές κειμένου σε στήλες με συγκεκριμένους τύπους δεδομένων. Προσθέτει το πεδίο <code>_parse_ok</code>, το οποίο δηλώνει αν κάθε γραμμή περνά τους ελέγχους εγκυρότητας.</p>"},"p_valid":{"kind":"node","title":"valid_records()","subtitle":"src/har_spark/ingest.py:74","long_text":"<p>Η <code>valid_records()</code> κρατά τις γραμμές που περνούν τους ελέγχους εγκυρότητας και αντιστοιχούν στη συσκευή και στους αισθητήρες του πειράματος. Επιστρέφει τις στήλες που χρειάζονται για τον υπολογισμό των παραθύρων.</p>"},"p_window":{"kind":"node","title":"build_window_features()","subtitle":"src/har_spark/features.py:51","long_text":"<p>Η <code>build_window_features()</code> υπολογίζει το αναγνωριστικό παραθύρου, το μέτρο και την ενέργεια της μέτρησης. Ομαδοποιεί τις μετρήσεις και υπολογίζει 18 χαρακτηριστικά ανά αισθητήρα και παράθυρο. Απορρίπτει παράθυρα με ανεπαρκείς μετρήσεις και αντικαθιστά τις τιμές null/NaN των χαρακτηριστικών.</p>"},"p_fuse":{"kind":"node","title":"fuse_sensor_features()","subtitle":"src/har_spark/features.py:104","long_text":"<p>Η <code>fuse_sensor_features()</code> συνδυάζει χαρακτηριστικά επιταχυνσιομέτρου και γυροσκοπίου, όταν χρησιμοποιούνται και οι δύο αισθητήρες. Ενώνει μόνο τα αντίστοιχα παράθυρα και προσθέτει στα ονόματα των στηλών πρόθεμα που δηλώνει τον αισθητήρα.</p>"},"p_split":{"kind":"node","title":"assign_subject_splits()","subtitle":"src/har_spark/features.py:145","long_text":"<p>Η <code>assign_subject_splits()</code> αντιστοιχίζει όλες τις καταγραφές κάθε ατόμου σε ένα μόνο σύνολο: εκπαίδευσης, επικύρωσης ή δοκιμής. Η αντιστοίχιση προστίθεται σε κάθε παράθυρο, ώστε δεδομένα του ίδιου ατόμου να μην εμφανίζονται και στην εκπαίδευση και στη δοκιμή.</p>"},"e_8_p_root_p_spark":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → build_spark()","long_text":"Δημιουργεί το SparkSession που απαιτείται για την ανάγνωση και την επεξεργασία.","source":"prepare_features()","target":"build_spark()"},"e_9_p_root_p_parse":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → parse_wisdm_raw()","long_text":"Περνά τη διαδρομή των αρχικών αρχείων στη συνάρτηση ανάλυσης των μετρήσεων.","source":"prepare_features()","target":"parse_wisdm_raw()"},"e_10_p_root_p_valid":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → valid_records()","long_text":"Φιλτράρει τις εγγραφές με βάση την εγκυρότητα, τη συσκευή και τους αισθητήρες.","source":"prepare_features()","target":"valid_records()"},"e_11_p_root_p_window":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → build_window_features()","long_text":"Δίνει τις έγκυρες μετρήσεις στον υπολογισμό χαρακτηριστικών ανά παράθυρο.","source":"prepare_features()","target":"build_window_features()"},"e_12_p_root_p_fuse":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → fuse_sensor_features()","long_text":"Συνδυάζει τα χαρακτηριστικά των αντίστοιχων παραθύρων, όταν χρησιμοποιούνται δύο αισθητήρες.","source":"prepare_features()","target":"fuse_sensor_features()"},"e_13_p_root_p_split":{"kind":"edge","title":"Άμεση κλήση","subtitle":"prepare_features() → assign_subject_splits()","long_text":"Αντιστοιχίζει τα παράθυρα σε σύνολα εκπαίδευσης, επικύρωσης και δοκιμής, ανά άτομο.","source":"prepare_features()","target":"assign_subject_splits()"},"t_loop":{"kind":"node","title":"_run_models()","subtitle":"src/har_spark/pipeline.py:83","long_text":"<p>Η <code>_run_models()</code> επαναλαμβάνει την κλήση της <code>train_and_evaluate()</code> για καθένα από τα δύο μοντέλα. Και τα δύο χρησιμοποιούν τα ίδια χαρακτηριστικά και τον ίδιο διαχωρισμό δεδομένων.</p>"},"t_fit":{"kind":"node","title":"train_and_evaluate()","subtitle":"src/har_spark/model.py:134","long_text":"<p>Η <code>train_and_evaluate()</code> επιλέγει τα σύνολα δεδομένων και τις στήλες χαρακτηριστικών, κατασκευάζει το Pipeline και καλεί <code>fit(train)</code>. Στη συνέχεια εφαρμόζει το εκπαιδευμένο μοντέλο στη δοκιμή, υπολογίζει τους δείκτες αξιολόγησης και αποθηκεύει το μοντέλο και τα αποτελέσματα.</p>"},"t_schema":{"kind":"node","title":"model_feature_columns()","subtitle":"src/har_spark/features.py:128","long_text":"<p>Η <code>model_feature_columns()</code> επιστρέφει τις επιτρεπόμενες αριθμητικές στήλες με σταθερή σειρά. Δεν υπολογίζει νέα χαρακτηριστικά και δεν διαβάζει τις τιμές των εγγραφών· ορίζει ποιες στήλες θα συγκεντρώσει ο VectorAssembler στο διάνυσμα εισόδου.</p>"},"t_recipe":{"kind":"node","title":"_pipeline()","subtitle":"src/har_spark/model.py:27","long_text":"<p>Η <code>_pipeline()</code> ορίζει τα στάδια StringIndexer, VectorAssembler, StandardScaler και ταξινομητή. Το Pipeline δεν έχει ακόμη εκπαιδευτεί. Οι παράμετροι των σταδίων προσδιορίζονται όταν κληθεί το <code>fit(train)</code>.</p>"},"t_metrics":{"kind":"node","title":"_confusion_and_macro_metrics()","subtitle":"src/har_spark/model.py:77","long_text":"<p>Η <code>_confusion_and_macro_metrics()</code> καταμετρά στο Spark τα ζεύγη πραγματικής και προβλεπόμενης δραστηριότητας. Από τον μικρό πίνακα σύγχυσης υπολογίζει ακρίβεια, ανάκληση και F1 ανά κλάση, καθώς και τους μέσους όρους macro. Δεν εκπαιδεύει το μοντέλο και δεν παράγει προβλέψεις.</p>"},"e_14_t_loop_t_fit":{"kind":"edge","title":"Άμεση κλήση","subtitle":"_run_models() → train_and_evaluate()","long_text":"Εκτελεί μία εκπαίδευση και αξιολόγηση για κάθε μοντέλο.","source":"_run_models()","target":"train_and_evaluate()"},"e_15_t_fit_t_schema":{"kind":"edge","title":"Άμεση κλήση","subtitle":"train_and_evaluate() → model_feature_columns()","long_text":"Ζητά την ακριβή λίστα και τη σειρά των χαρακτηριστικών εισόδου.","source":"train_and_evaluate()","target":"model_feature_columns()"},"e_16_t_fit_t_recipe":{"kind":"edge","title":"Άμεση κλήση","subtitle":"train_and_evaluate() → _pipeline()","long_text":"Κατασκευάζει το Pipeline με τις στήλες χαρακτηριστικών και τις ρυθμίσεις του μοντέλου.","source":"train_and_evaluate()","target":"_pipeline()"},"e_17_t_fit_t_metrics":{"kind":"edge","title":"Άμεση κλήση","subtitle":"train_and_evaluate() → _confusion_and_macro_metrics()","long_text":"Αξιολογεί τις προβλέψεις στο σύνολο δοκιμής.","source":"train_and_evaluate()","target":"_confusion_and_macro_metrics()"},"c_main":{"kind":"node","title":"main()","subtitle":"cloud/cloud_pipeline.py:108","long_text":"<p>Η <code>main()</code> του <code>cloud_pipeline.py</code> είναι το σημείο εισόδου της εργασίας Managed Spark. Διαβάζει τις παραμέτρους και συντονίζει την προεπεξεργασία, την εκπαίδευση, την πρόβλεψη, την αξιολόγηση και την αποθήκευση στο νέφος.</p>"},"c_args":{"kind":"node","title":"arguments()","subtitle":"cloud/cloud_pipeline.py:33","long_text":"<p>Η <code>arguments()</code> ορίζει και διαβάζει τις παραμέτρους της εργασίας στο νέφος: διαδρομές εισόδου και εξόδου, συσκευή, διάρκεια παραθύρου, ελάχιστο πλήθος μετρήσεων και seed. Στο συγκεκριμένο πρόγραμμα οι επιλογές δίνονται ως παράμετροι της εργασίας, αντί μέσω του τοπικού αρχείου YAML.</p>"},"c_recipe":{"kind":"node","title":"model_pipeline()","subtitle":"cloud/cloud_pipeline.py:47","long_text":"<p>Η <code>model_pipeline()</code> δημιουργεί τα ίδια είδη σταδίων με την τοπική εφαρμογή: κωδικοποίηση δραστηριότητας, διάνυσμα χαρακτηριστικών, τυποποίηση και Λογιστική Παλινδρόμηση ή Random Forest. Η εκτέλεση γίνεται στην υπηρεσία Managed Spark.</p>"},"c_write":{"kind":"node","title":"write_json()","subtitle":"cloud/cloud_pipeline.py:95","long_text":"<p>Η <code>write_json()</code> αποθηκεύει μικρές συνόψεις αποτελεσμάτων και μεταδεδομένα στο Cloud Storage μέσω του Spark. Δεν επανεγγράφει το αρχικό σύνολο δεδομένων και δεν εκτελεί υπολογισμούς του μοντέλου.</p>"},"c_parse":{"kind":"node","title":"parse_wisdm_raw()","subtitle":"src/har_spark/ingest.py:16","long_text":"<p>Στο νέφος καλείται η ίδια <code>parse_wisdm_raw()</code> για την ανάλυση των αρχείων WISDM του Cloud Storage. Οι τύποι στηλών και οι έλεγχοι εγκυρότητας είναι ίδιοι με την τοπική εφαρμογή.</p>"},"c_features":{"kind":"node","title":"build_window_features()","subtitle":"src/har_spark/features.py:51","long_text":"<p>Στο νέφος καλείται η ίδια <code>build_window_features()</code> για τη δημιουργία παραθύρων και τον υπολογισμό χαρακτηριστικών. Οι υπολογισμοί εκτελούνται από τους executors της υπηρεσίας, χωρίς να αλλάζει ο ορισμός των χαρακτηριστικών.</p>"},"c_metrics":{"kind":"node","title":"_confusion_and_macro_metrics()","subtitle":"src/har_spark/model.py:77","long_text":"<p>Στο νέφος καλείται η ίδια <code>_confusion_and_macro_metrics()</code> για την αξιολόγηση των προβλέψεων. Έτσι οι δείκτες υπολογίζονται με τον ίδιο τρόπο στα δύο περιβάλλοντα.</p>"},"e_18_c_main_c_args":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → arguments()","long_text":"Διαβάζει τις διαδρομές και τις ρυθμίσεις της εργασίας στο νέφος.","source":"main()","target":"arguments()"},"e_19_c_main_c_recipe":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → model_pipeline()","long_text":"Κατασκευάζει το αντίστοιχο Pipeline πριν από την εκπαίδευση κάθε μοντέλου.","source":"main()","target":"model_pipeline()"},"e_20_c_main_c_write":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → write_json()","long_text":"Αποθηκεύει τις συνόψεις αποτελεσμάτων μετά την ολοκλήρωση των υπολογισμών.","source":"main()","target":"write_json()"},"e_21_c_main_c_parse":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → parse_wisdm_raw()","long_text":"Διαβάζει τα αρχικά αρχεία του Cloud Storage με την κοινή συνάρτηση ανάλυσης.","source":"main()","target":"parse_wisdm_raw()"},"e_22_c_main_c_features":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → build_window_features()","long_text":"Υπολογίζει χαρακτηριστικά από τις έγκυρες μετρήσεις με τους ίδιους κανόνες όπως τοπικά.","source":"main()","target":"build_window_features()"},"e_23_c_main_c_metrics":{"kind":"edge","title":"Άμεση κλήση","subtitle":"main() → _confusion_and_macro_metrics()","long_text":"Αξιολογεί τις προβλέψεις με την ίδια συνάρτηση όπως στην τοπική εκτέλεση.","source":"main()","target":"_confusion_and_macro_metrics()"}}};
const view=document.querySelector('.view[data-view="source"]');
const svg=view.querySelector('svg');
const viewport=svg.querySelector('.viewport');
const initialMarkup=svg.innerHTML;
const initialTransforms={};
svg.querySelectorAll('.node').forEach(n=>initialTransforms[n.dataset.key]=n.getAttribute('transform'));

function nodeInfo(g){
  const t=g.transform.baseVal.consolidate();
  return {x:t?t.matrix.e:0,y:t?t.matrix.f:0,w:+g.dataset.w,h:+g.dataset.h};
}
function sidePoint(i,side){
  if(side==='left') return [i.x,i.y+i.h/2];
  if(side==='right') return [i.x+i.w,i.y+i.h/2];
  if(side==='top') return [i.x+i.w/2,i.y];
  return [i.x+i.w/2,i.y+i.h];
}
function nearestSide(a,b){
  const ac=[a.x+a.w/2,a.y+a.h/2], bc=[b.x+b.w/2,b.y+b.h/2];
  const dx=bc[0]-ac[0], dy=bc[1]-ac[1];
  return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'bottom':'top');
}
function curveFor(a){
  const src=svg.querySelector(`.node[data-key="${a.dataset.src}"]`);
  const dst=svg.querySelector(`.node[data-key="${a.dataset.dst}"]`);
  if(!src||!dst) return '';
  const A=nodeInfo(src), B=nodeInfo(dst);
  const sa=a.dataset.srcSide||nearestSide(A,B), sb=a.dataset.dstSide||nearestSide(B,A);
  const [x1,y1]=sidePoint(A,sa), [x2,y2]=sidePoint(B,sb);
  let route=null;
  try{ route=JSON.parse(a.dataset.route||'null'); }catch{}
  if(route && route.length){
    const pts=[[x1,y1],...route,[x2,y2]];
    return pts.map((p,i)=>(i?'L':'M')+` ${p[0]} ${p[1]}`).join(' ');
  }
  const mx=(x1+x2)/2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}
function relink(){
  svg.querySelectorAll('.arrow').forEach(a=>{
    const d=curveFor(a);
    a.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
  });
}
function relinkConnected(key){
  svg.querySelectorAll(`.arrow[data-src="${key}"],.arrow[data-dst="${key}"]`).forEach(a=>{
    const d=curveFor(a); a.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
  });
}
function applyViewport(){
  viewport.setAttribute('transform',`translate(${svg.dataset.tx||0} ${svg.dataset.ty||0}) scale(${svg.dataset.zoom||1})`);
}
function fit(){
  viewport.setAttribute('transform','translate(0 0) scale(1)');
  svg.dataset.tx='0';
  svg.dataset.ty='0';
  svg.dataset.zoom='1';
  let bb=null;
  try{ bb=viewport.getBBox(); }catch(e){}
  if(bb&&bb.width>0&&bb.height>0){
    const pad=40;
    svg.setAttribute('viewBox',`${bb.x-pad} ${bb.y-pad} ${bb.width+2*pad} ${bb.height+2*pad}`);
  }else{
    svg.setAttribute('viewBox','0 -80 1320 1320');
  }
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
}
window.addEventListener('resize',()=>{ if(svg.dataset.zoom==='1'&&svg.dataset.tx==='0'&&svg.dataset.ty==='0') fit(); });
function showDetails(key){
  const d=DETAILS.source[key]; if(!d) return;
  const panel=view.querySelector('.panel');
  const subtitle=d.subtitle||'';
  panel.innerHTML=`<h2>${d.title||''}</h2>${subtitle?`<div class="right-subtitle">${subtitle}</div>`:''}<div class="narrative">${d.long_text||''}</div>${d.kind==='edge'&&d.source?`<div class="relation-line"><span>${d.source}</span><b>→</b><span>${d.target}</span></div>`:''}<div class="tipline">Επιλέξτε άλλο πλαίσιο ή βέλος για να συνεχίσετε.</div>`;
  view.querySelector('.details').scrollTop=0;
}
function select(el){
  view.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  showDetails(el.dataset.key);
}
function sourceChapter(slice){
  view.querySelectorAll('[data-source-slice]').forEach(b=>{
    const on=b.dataset.sourceSlice===slice; b.classList.toggle('active',on); b.setAttribute('aria-pressed',on?'true':'false');
  });
  view.querySelectorAll('.source-slice').forEach(g=>g.style.display=g.dataset.slice===slice?'inline':'none');
  relink();
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      fit();
      const first=view.querySelector(`.source-slice[data-slice="${slice}"] .node`);
      if(first) select(first);
    });
  });
}
function outerPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function viewportPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(viewport.getScreenCTM().inverse());}
let drag=null, pan=null;
svg.addEventListener('pointerdown',e=>{
  const node=e.target.closest('.node');
  if(node){
    const p=viewportPoint(e), i=nodeInfo(node);
    drag={node,dx:p.x-i.x,dy:p.y-i.y};
    node.setPointerCapture(e.pointerId); return;
  }
  if(e.target.closest('.arrow')) return;
  const p=outerPoint(e); pan={x:p.x,y:p.y,tx:+(svg.dataset.tx||0),ty:+(svg.dataset.ty||0)}; svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(drag){ const p=viewportPoint(e); drag.node.setAttribute('transform',`translate(${p.x-drag.dx},${p.y-drag.dy})`); relinkConnected(drag.node.dataset.key); }
  else if(pan){ const p=outerPoint(e); svg.dataset.tx=pan.tx+(p.x-pan.x); svg.dataset.ty=pan.ty+(p.y-pan.y); applyViewport(); }
});
svg.addEventListener('pointerup',()=>{drag=null;pan=null;});
svg.addEventListener('pointercancel',()=>{drag=null;pan=null;});
svg.addEventListener('wheel',e=>{e.preventDefault();let z=+(svg.dataset.zoom||1);z*=e.deltaY<0?1.12:.89;svg.dataset.zoom=Math.max(.35,Math.min(3.5,z));applyViewport();},{passive:false});

view.querySelectorAll('.node,.arrow').forEach(el=>{el.addEventListener('click',()=>select(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el);}})});
view.querySelectorAll('[data-source-slice]').forEach(b=>b.addEventListener('click',()=>sourceChapter(b.dataset.sourceSlice)));
view.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='zoom-in'||a==='zoom-out'){let z=+(svg.dataset.zoom||1);z*=a==='zoom-in'?1.2:.83;svg.dataset.zoom=Math.max(.35,Math.min(3.5,z));applyViewport();}
  else if(a==='fit') fit();
  else if(a==='reset'){svg.querySelectorAll('.node').forEach(n=>{if(initialTransforms[n.dataset.key])n.setAttribute('transform',initialTransforms[n.dataset.key]);});relink();fit();sourceChapter('entry');}
  else if(a==='toggle-overview'){view.classList.toggle('hide-overview');b.textContent=view.classList.contains('hide-overview')?'Εμφάνιση αριστερά':'Απόκρυψη αριστερά';setTimeout(fit,0);}
  else if(a==='toggle-details'){view.classList.toggle('hide-details');b.textContent=view.classList.contains('hide-details')?'Εμφάνιση δεξιά':'Απόκρυψη δεξιά';setTimeout(fit,0);}
  else if(a==='save-svg'){
    const clone=svg.cloneNode(true); clone.querySelector('.handles')?.remove(); clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='har-function-map.svg';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
}));

window.addEventListener('resize',()=>{
  const active=view.querySelector('[data-source-slice][aria-pressed="true"]');
  if(active) requestAnimationFrame(()=>fit());
});

window.addEventListener('load',()=>{relink();sourceChapter('entry');},{once:true});
</script></body></html>
